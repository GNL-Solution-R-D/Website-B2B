# =====================================================================
#  GNL Solution — configuration Apache (même forme que la config actuelle :
#  un seul DocumentRoot /var/www/html pour tous les domaines)
#  Tout est ici : le site fonctionne même si le .htaccess n'est pas copié.
#  Après modification : apache2ctl configtest && apache2ctl graceful
#  (ou redémarrer le conteneur).
# =====================================================================
<IfModule !rewrite_module>
  LoadModule rewrite_module /usr/lib/apache2/modules/mod_rewrite.so
</IfModule>
<IfModule !headers_module>
  LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
</IfModule>
<IfModule !expires_module>
  LoadModule expires_module /usr/lib/apache2/modules/mod_expires.so
</IfModule>

ServerName localhost
DocumentRoot /var/www/html

ErrorLog /var/log/apache2/error.log
CustomLog /var/log/apache2/access.log combined

<Directory /var/www/html>
  Options -Indexes +FollowSymLinks
  AllowOverride All
  Require all granted
  DirectoryIndex router.php
  # Toute URL qui n'est pas un fichier réel (/fr/, /it/contact…) passe par le routeur
  FallbackResource /router.php
</Directory>

# Dossiers internes : jamais servis directement (même sans .htaccess)
<DirectoryMatch "^/var/www/html/(include|lang|geoip|pages)/">
  Require all denied
</DirectoryMatch>

# Cache navigateur des ressources statiques (GreenIT RWEB_0075)
# CSS/JS sont appelés avec ?v=<date de modification> : cache d'un an sans risque.
<FilesMatch "\.(css|js|woff2?|ttf|otf)$">
  Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
<FilesMatch "\.(svg|png|jpe?g|webp|avif|gif|ico)$">
  Header set Cache-Control "public, max-age=2592000"
</FilesMatch>
ExpiresActive On
ExpiresByType text/css "access plus 1 year"
ExpiresByType application/javascript "access plus 1 year"
ExpiresByType text/javascript "access plus 1 year"
ExpiresByType font/ttf "access plus 1 year"
ExpiresByType font/woff2 "access plus 1 year"
ExpiresByType image/svg+xml "access plus 30 days"
ExpiresByType image/png "access plus 30 days"
ExpiresByType image/jpeg "access plus 30 days"
ExpiresByType image/webp "access plus 30 days"
